name: Presentation examples

on:
  push:
    branches: ['presentation/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: simulator/web/package-lock.json
      - name: Native exact arithmetic
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgmp-dev
          cmake -S simulator/c -B simulator/c/build -DCMAKE_BUILD_TYPE=Release
          cmake --build simulator/c/build -j4
      - name: Verify constructions and independent oracle
        run: |
          python3 simulator/presentation/validate_examples.py
          git diff --exit-code -- simulator/web/public/presentation/examples.json simulator/presentation/scenarios simulator/presentation/STORYBOARD.md
      - name: Native and WebAssembly parity
        env:
          COUNTING_WASM_MODULE: simulator/web/public/engine.mjs
        run: node simulator/scripts/check_wasm_parity.mjs simulator/presentation/scenarios/*.json
      - name: Browser dependencies
        working-directory: simulator/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Regression and presentation tests
        working-directory: simulator/web
        run: npm test
      - name: Production build
        working-directory: simulator/web
        run: npm run build -- --base=/ADDN_simulator/
      - name: Presentation under the GitHub Pages prefix
        working-directory: simulator/web
        run: npm run test:pages -- --grep 'presentation data'
