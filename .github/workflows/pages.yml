name: Test and deploy simulator

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out simulator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: simulator/web/package-lock.json
      - name: Build exact WebAssembly engine
        run: bash simulator/scripts/build_wasm.sh
      - name: Install web dependencies
        working-directory: simulator/web
        run: npm ci
      - name: Install browser for tests
        working-directory: simulator/web
        run: npx playwright install --with-deps chromium
      - name: Test simulator and mathematical evidence
        working-directory: simulator/web
        run: npm test
      - name: Package third-party notices and relinking materials
        run: python3 simulator/scripts/package_site.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build site for its published URL
        working-directory: simulator/web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build -- --base="${PAGES_BASE_PATH}/"
      - name: Test production site and WebAssembly under its URL prefix
        working-directory: simulator/web
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run test:pages
      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: simulator/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy simulator
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
